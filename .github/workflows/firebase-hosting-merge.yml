name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' || secrets.FIREBASE_SERVICE_ACCOUNT_PEGALADRAO_CC900 != '' }}
      HAS_TOKEN: ${{ secrets.FIREBASE_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build
        env:
          VITE_FB_API_KEY: ${{ secrets.VITE_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN: ${{ secrets.VITE_FB_AUTH_DOMAIN }}
          VITE_FB_PROJECT_ID: ${{ secrets.VITE_FB_PROJECT_ID }}
          VITE_FB_STORAGE_BUCKET: ${{ secrets.VITE_FB_STORAGE_BUCKET }}
          VITE_FB_MESSAGING_SENDER_ID: ${{ secrets.VITE_FB_MESSAGING_SENDER_ID }}
          VITE_FB_APP_ID: ${{ secrets.VITE_FB_APP_ID }}
          VITE_FB_MEASUREMENT_ID: ${{ secrets.VITE_FB_MEASUREMENT_ID }}
          VITE_DEFAULT_COMPROVANTE_URL: ${{ secrets.VITE_DEFAULT_COMPROVANTE_URL }}

      - name: Deploy with Service Account (FirebaseExtended)
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_PEGALADRAO_CC900 }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID || secrets.VITE_FB_PROJECT_ID }}

      - name: Deploy with Firebase Token
        if: env.HAS_SERVICE_ACCOUNT != 'true' && env.HAS_TOKEN == 'true'
        run: npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Verify Secret Presence
        if: env.HAS_SERVICE_ACCOUNT != 'true' && env.HAS_TOKEN != 'true'
        run: |
          echo "::error::Nenhuma credencial de autenticação encontrada nos Secrets do repositório!"
          echo "Configure 'FIREBASE_SERVICE_ACCOUNT' (ou 'FIREBASE_SERVICE_ACCOUNT_PEGALADRAO_CC900') ou 'FIREBASE_TOKEN' em Settings > Secrets and variables > Actions."
          exit 1
